  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-blue-700 mb-6">📚 My Books</h1>

    <!-- Active Borrowings -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold mb-2">🔄 Active Borrowings</h2>
      <ul id="activeList" class="space-y-2"></ul>
    </div>

    <!-- Borrowing History -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold mb-2">📜 Borrowing History</h2>
      <ul id="historyList" class="space-y-2"></ul>
    </div>

    <!-- Want to Read List -->
    <div>
      <h2 class="text-xl font-semibold mb-2">📖 Want to Read</h2>
      <ul id="wantList" class="space-y-2"></ul>
    </div>
  </div>

  <script>
    async function initializeMyBooksData() {
  const user = JSON.parse(localStorage.getItem('loggedInUser'));
  if (!user) {
    alert("Please log in.");
    window.location.href = "login.html";
    return;
  }

  const userId = user.id;

  const booksSnapshot = await firebase.database().ref('books').once('value');
  const books = booksSnapshot.val();

  const borrowsSnapshot = await firebase.database().ref('borrows').once('value');
  const borrows = borrowsSnapshot.val();

  const activeBooks = [];
  const historyBooks = [];

  for (const i in borrows) {
    const borrow = borrows[i];
    if (!borrow || parseInt(borrow.user_id) !== parseInt(userId)) continue;

    const book = books[parseInt(borrow.book_id)];
    if (!book) continue;

    // ✅ כאן מוסיפים מזהה ותאריך החזרה
    book.id = parseInt(borrow.book_id);
    book.ret_date = borrow.ret_date;

    if (borrow.status === "borrow") {
      activeBooks.push(book);
    } else {
      historyBooks.push(book);
    }
  }

  localStorage.setItem('activeBooks', JSON.stringify(activeBooks));
  localStorage.setItem('borrowHistory', JSON.stringify(historyBooks));
}


  
    function renderList(containerId, list, isActive = false) {
  const container = document.getElementById(containerId);
  container.innerHTML = list.length ? '' : '<li class="text-gray-500">No books found.</li>';

  list.forEach((book, index) => {
    const card = document.createElement('div');
    card.className = 'bg-white p-3 shadow-md rounded-lg hover:shadow-lg transition w-64';

    const isOverdue = isActive && book.ret_date && new Date(book.ret_date) < new Date();

    card.innerHTML = `
      <img src="${book.photo || 'https://via.placeholder.com/120x180?text=No+Image'}"
           alt="${book.name}"
           class="w-full h-40 object-cover rounded mb-2">

      <h3 class="text-base font-bold text-gray-800 mb-1">${book.name}</h3>
      <p class="text-xs text-gray-600 mb-1"><strong>Author:</strong> ${book.author}</p>
      <p class="text-xs text-gray-600 mb-1"><strong>Subject:</strong> ${book.subject}</p>
      <p class="text-xs text-gray-500 mb-2">${book.description}</p>

      ${book.ret_date ? `
        <p class="text-xs font-semibold ${isOverdue ? 'text-red-600' : 'text-gray-700'}">
          Return by: ${book.ret_date}
        </p>` : ''}

      ${isActive
        ? `<button class="w-full mt-2 py-1 text-sm rounded text-white font-semibold shadow bg-red-500 hover:bg-red-600">
             🔁 Return
           </button>`
        : ''}
    `;

    if (isActive) {
      card.querySelector('button').addEventListener('click', () => {
        returnBook(index);
      });
    }

    container.appendChild(card);
  });
}


  
    function returnBook(index) {
      async function returnBook(index) {
        const user = JSON.parse(localStorage.getItem('loggedInUser'));
        const userId = user.id;

        const active = JSON.parse(localStorage.getItem('activeBooks')) || [];
        const history = JSON.parse(localStorage.getItem('borrowHistory')) || [];

        const returnedBook = active.splice(index, 1)[0];

        console.log("returned book:", returnedBook);
        console.log("returned book id:", returnedBook.id);
        
        history.unshift(returnedBook);

        // 🔁 1. עדכון הסטטוס של ההשאלה ל־"returned"
        const borrowsSnapshot = await firebase.database().ref('borrows').once('value');
        const borrows = borrowsSnapshot.val();

        for (let i = 1; i < borrows.length; i++) {
          const borrow = borrows[i];
          if (!borrow) continue;

          if (
            parseInt(borrow.user_id) === parseInt(userId) &&
            parseInt(borrow.book_id) === parseInt(returnedBook.id) &&
            borrow.status === "borrow"
          ) {
            await firebase.database().ref(`borrows/${i}/status`).set("returned");
            break;
          }
        }

        //  2. עדכון מספר העותקים הפנויים של הספר
        const bookRef = firebase.database().ref(`books/${returnedBook.id}/available_copies`);
        const currentCopiesSnapshot = await bookRef.once('value');
        const currentCopies = currentCopiesSnapshot.val() || 0;
        await bookRef.set(currentCopies + 1);

        //  3. עדכון localStorage והתצוגה
        localStorage.setItem('activeBooks', JSON.stringify(active));
        localStorage.setItem('borrowHistory', JSON.stringify(history));

        renderList('activeList', active, true);
        renderList('historyList', history);

        //  4. הודעת הצלחה
        alert(`📚 הספר "${returnedBook.name}"The book has been successfully returned!`);
      }

          if (confirm("Are you sure you want to return this book?")) {
            returnBook(index);
          }

    }
  
    initializeMyBooksData().then(() => {
      const active = JSON.parse(localStorage.getItem('activeBooks')) || [];
      const history = JSON.parse(localStorage.getItem('borrowHistory')) || [];
      const wantToRead = JSON.parse(localStorage.getItem('wantToRead')) || [];
  
      renderList('activeList', active, true);
      renderList('historyList', history);
      renderList('wantList', wantToRead);
    });
  </script>
